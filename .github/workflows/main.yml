name: Build NovelDen APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

- name: Fix Gradle wrapper version
        run: |
          mkdir -p novelDen/android/gradle/wrapper
          echo "distributionBase=GRADLE_USER_HOME" > novelDen/android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionPath=wrapper/dists" >> novelDen/android/gradle/wrapper/gradle-wrapper.properties
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip" >> novelDen/android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStoreBase=GRADLE_USER_HOME" >> novelDen/android/gradle/wrapper/gradle-wrapper.properties
          echo "zipStorePath=wrapper/dists" >> novelDen/android/gradle/wrapper/gradle-wrapper.properties
          cat novelDen/android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: novelDen
        run: flutter pub get

      - name: Generate code
        working-directory: novelDen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Remove missing font references
        working-directory: novelDen
        run: |
          sed -i '/  fonts:/,/^[^ ]/{ /  fonts:/d; /    - family:/d; /      fonts:/d; /        - asset: assets\/fonts/d; /          style:/d }' pubspec.yaml

      - name: Build APK
        working-directory: novelDen
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NovelDen-APK
          path: novelDen/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
