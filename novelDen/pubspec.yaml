name: novel_den
description: A local e-reader with web novel scraping capabilities.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.2

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.3

  # HTTP & Scraping
  dio: ^5.4.1
  html: ^0.15.4

  # File handling
  file_picker: ^6.1.1
  permission_handler: ^11.3.0
  share_plus: ^7.2.2

  # Reading formats
  epub_view: ^3.2.0

  # PDF
  pdfx: ^2.6.0

  # EPUB generation
  archive: ^3.4.10
  xml: ^6.5.0

  # Background tasks
  flutter_background_service: ^5.0.5

  # UI / UX
  google_fonts: ^6.1.0
  flutter_slidable: ^3.0.1
  cached_network_image: ^3.3.1

  # Utilities
  uuid: ^4.3.3
  intl: ^0.19.0
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
  assets:
    - assets/site_configs/templates.json
  fonts:
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
        - asset: assets/fonts/Literata-Italic.ttf
          style: italic
